name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > local.properties
          fi

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Extract Version Info
        id: version_info
        run: |
          VERSION_NAME=$(jq -r '.versionName' app-version.json)
          VERSION_CODE=$(jq -r '.versionCode' app-version.json)
          TITLE=$(jq -r '.title' app-version.json)
          CHANGELOG=$(jq -r '.changelog' app-version.json)
          echo "tag=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "title=GabAI v${VERSION_NAME} - ${TITLE}" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Prepare APK Release Assets
        run: |
          VERSION_NAME=$(jq -r '.versionName' app-version.json)
          mkdir -p release-assets
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" "release-assets/GabAI-v${VERSION_NAME}.apk"
          cp "$APK_FILE" "release-assets/GabAI.apk"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          name: ${{ steps.version_info.outputs.title }}
          body: ${{ steps.version_info.outputs.changelog }}
          files: |
            release-assets/GabAI-v${{ steps.version_info.outputs.tag }}.apk
            release-assets/GabAI.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

