name: Capture Authentic Android Screenshots

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'scripts/capture_all_screens.sh'
      - '.github/workflows/capture-screenshots.yml'
      - 'app/src/main/java/com/example/gabai/MainActivity.kt'

permissions:
  contents: write

jobs:
  capture-mobile-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > local.properties
          else
            touch local.properties
          fi

      - name: Make Scripts Executable
        run: |
          chmod +x gradlew
          chmod +x scripts/capture_all_screens.sh

      - name: Enable KVM hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run Emulator & Capture Genuine Screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ./scripts/capture_all_screens.sh

      - name: Upload Screenshots Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authentic-mobile-screenshots
          path: manual_assets/screenshots/mobile/*.png
          if-no-files-found: warn

      - name: Commit and Push Screenshots
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Emulator Capture]"
          git add manual_assets/screenshots/mobile/
          if git diff --staged --quiet; then
            echo "No screenshot updates to commit."
          else
            git commit -m "docs(screenshots): add authentic Android OS screencaps from cloud emulator [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
