# Project-wide Gradle settings.
# Specifies the JVM arguments used for the daemon process (tuned to fit in 1.6GB free RAM without Windows disk paging)
org.gradle.jvmargs=-Xmx1536m -XX:+UseParallelGC -XX:SoftRefLRUPolicyMSPerMB=0 -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx768m -XX:+UseParallelGC

# AndroidX and AGP Compatibility
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# High-Performance Caching, Daemon & Parallelism
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.vfs.watch=true
kotlin.incremental=true
kotlin.compiler.execution.strategy=daemon
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# Enable 16 KB page size alignment for native libraries
android.ndk.maxPageSize=16384

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
