<html>
<head>
    <script src="https://js.puter.com/v2/"></script>
</head>
<body>
<script>
    // This function will be called from your Kotlin code
    function askGemini(promptText) {
        puter.ai.chat(promptText, {
            model: 'gemini-2.5-flash'
        }).then(response => {
            // Send the result back to Android
            AndroidInterface.onResult(response.toString());
        }).catch(error => {
            AndroidInterface.onError(error.toString());
        });
    }
</script>
</body>
</html>
